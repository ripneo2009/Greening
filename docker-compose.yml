services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: greening
      POSTGRES_PASSWORD: greening
      POSTGRES_DB: greening
    ports:
      - "5432:5432"
    volumes:
      - greening_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greening"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  greening_pgdata:
